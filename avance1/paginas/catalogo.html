<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de iniciativas — Innovation Hub</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <header>
    <a href="../index.html">Innovation Hub</a>
    <nav data-nav aria-label="Principal"></nav>
  </header>

  <h1>Catálogo de iniciativas</h1>

  <aside aria-labelledby="titulo-filtros">
    <h2 id="titulo-filtros">Filtrar iniciativas</h2>
    <form data-form-filtros>
      <p>
        <label for="filtro-texto">Buscar</label>
        <input type="text" id="filtro-texto" name="texto">
      </p>
      <p>
        <label for="filtro-tipo">Tipo</label>
        <select id="filtro-tipo" name="tipo">
          <option value="">Todos</option>
          <option value="Idea">Idea</option>
          <option value="Necesidad">Necesidad</option>
          <option value="Reto">Reto</option>
        </select>
      </p>
      <p>
        <label for="filtro-categoria">Categoría</label>
        <select id="filtro-categoria" name="categoria" data-select-categorias>
          <option value="">Todas</option>
        </select>
      </p>
      <p>
        <label for="filtro-competencia">Competencia requerida</label>
        <select id="filtro-competencia" name="competencia" data-select-competencias>
          <option value="">Todas</option>
        </select>
      </p>
    </form>
  </aside>

  <section aria-labelledby="titulo-resultados">
    <h2 id="titulo-resultados" data-titulo-resultados>Cargando iniciativas...</h2>
    <div data-lista-iniciativas></div>
  </section>

  <footer>
    <p>Innovation Hub · Universidad CENFOTEC</p>
    <p><a href="mailto:hub@ejemplo.ac.cr">hub@ejemplo.ac.cr</a></p>
  </footer>

  <script src="../js/datos.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
