<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar participación - Innovation Hub</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <header>
    <nav data-nav aria-label="Principal"></nav>
  </header>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-8">

        <h1 class="mb-4">Solicitar participación</h1>

        <p id="estadoCarga" role="status">Cargando iniciativa…</p>
        <p id="estadoError" role="alert" class="alert alert-danger" hidden></p>

        <div id="contenido" hidden>
          <p>Iniciativa: <strong id="tituloIniciativa"></strong></p>
          <p><a id="enlaceVolver" href="catalogo.html">Volver al detalle</a></p>

          <p id="estadoSolicitud" role="alert" class="alert alert-warning" hidden></p>

          <form id="formSolicitud" novalidate>

            <fieldset class="card mb-4">
              <div class="card-body">
                <legend class="h5 mb-3">Sobre ti</legend>

                <div class="mb-3">
                  <label for="mensaje" class="form-label">Mensaje de presentación</label>
                  <textarea id="mensaje" name="mensaje" rows="4" class="form-control" aria-describedby="error-mensaje"></textarea>
                  <small id="error-mensaje" class="text-danger" role="alert" hidden></small>
                </div>

                <div class="mb-0">
                  <label for="competencia" class="form-label">Competencia principal que aportas</label>
                  <select id="competencia" name="competencia" class="form-select" aria-describedby="error-competencia">
                    <option value="">Selecciona una opción</option>
                  </select>
                  <small id="error-competencia" class="text-danger" role="alert" hidden></small>
                </div>
              </div>
            </fieldset>

            <fieldset class="card mb-4">
              <div class="card-body">
                <legend class="h5 mb-3">Participación deseada</legend>

                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="rol" class="form-label">Rol deseado</label>
                    <select id="rol" name="rol" class="form-select" aria-describedby="error-rol">
                      <option value="">Selecciona una opción</option>
                      <option value="Desarrollo">Desarrollo</option>
                      <option value="Diseño">Diseño</option>
                      <option value="Coordinación">Coordinación</option>
                      <option value="Otro">Otro</option>
                    </select>
                    <small id="error-rol" class="text-danger" role="alert" hidden></small>
                  </div>
                  <div class="col-12 col-md-6">
                    <label for="disponibilidad" class="form-label">Disponibilidad</label>
                    <select id="disponibilidad" name="disponibilidad" class="form-select" aria-describedby="error-disponibilidad">
                      <option value="">Selecciona una opción</option>
                      <option value="Pocas horas por semana">Pocas horas por semana</option>
                      <option value="Medio tiempo">Medio tiempo</option>
                      <option value="Tiempo completo">Tiempo completo</option>
                    </select>
                    <small id="error-disponibilidad" class="text-danger" role="alert" hidden></small>
                  </div>
                </div>
              </div>
            </fieldset>

            <button type="submit" class="btn btn-primary btn-lg">Enviar solicitud</button>
          </form>

          <section id="confirmacion" class="card border-success" aria-labelledby="titulo-confirmacion" hidden>
            <div class="card-body">
              <h2 id="titulo-confirmacion" class="h4 card-title">Solicitud enviada</h2>
              <p id="textoConfirmacion" role="status" class="card-text"></p>
              <a id="enlaceDetalle" class="btn btn-primary" href="catalogo.html">Ver la iniciativa</a>
              <a class="btn btn-outline-secondary" href="catalogo.html">Volver al catálogo</a>
            </div>
          </section>
        </div>

      </div>
    </div>
  </main>

  <footer class="container border-top py-4 mt-5">
    <p class="mb-0 text-body-secondary">Innovation Hub · Universidad CENFOTEC</p>
  </footer>

  <script src="../js/datos.js"></script>
  <script src="../js/almacenamiento.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/validacion.js"></script>
  <script src="../js/solicitud.js"></script>
</body>
</html>
